_format_version: "3.0"
_transform: true

services:
- name: auth-service
  url: http://host.docker.internal:5000
  routes:
  - name: auth-route
    paths:
      - /auth
- name: qna-service
  url: http://host.docker.internal:5001
  routes:
  - name: qna-route
    paths:
      - /qna
plugins:
- name: cors
  config:
    origins:
    - http://localhost:3000
    - http://localhost:5001
    - http://localhost:8000
    - http://localhost
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    headers:
    - Accept
    - Accept-Version
    - Content-Length
    - Content-MD5
    - Content-Type
    - Date
    - X-Auth-Token
    - Authorization
    private_network: true

