name: saulvn-backend

services:
  kong:
    image: kong:latest
    container_name: saul-kong
    restart: always
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./api-gateway/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    depends_on:
      - auth-service
    networks:
      - app-network

  auth-service:
    build: ./auth-service
    restart: always
    env_file:
      - ../.env
    depends_on:
      - auth-mysql
      - redis
    ports:
      - "5000:5000"
    environment:
      ENVIRONMENT: development
      PORT: 5000
      DB_HOST: auth-mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_KEY: ${ACCESS_TOKEN_KEY:-Vistral-Saul-VN}
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY:-auth-service}
      MFA_TOKEN_KEY: ${MFA_TOKEN_KEY:-auth-service-mfa}
      TOTP_SETUP_TTL_SECONDS: ${TOTP_SETUP_TTL_SECONDS:-600}
    networks:
      - app-network

  auth-mysql:
    image: mysql:latest
    restart: always
    ports:
      - "3308:3306"
    volumes:
      - ./auth-service/auth-sql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth
    networks:
      - app-network

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  qna-mysql:
    image: mysql:latest
    restart: always
    ports:
      - "3307:3306"
    volumes:
      - ./rag/qna-sql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456789}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qna}
    networks:
      - app-network

  neo4j:
    image: neo4j:5-community
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./graph/neo4j/data:/data
      - ./graph/neo4j/logs:/logs
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASS:-123456789}
    networks:
      - app-network

  qna-service:
    build: ./rag
    restart: always
    command: ["python", "app.py", "--server"]
    env_file:
      - ../.env
    depends_on:
      - qna-mysql
      - redis
      - neo4j
    ports:
      - "5001:5001"
    volumes:
      - ../web:/app/web:ro
      - ../.cache/huggingface:/app/.cache/huggingface
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456789}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qna}
      MYSQL_HOST: qna-mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_KEY: ${ACCESS_TOKEN_KEY:-Vistral-Saul-VN}
      WEB_DIR: /app/web
      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface/hub
      TRANSFORMERS_CACHE: /app/.cache/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/huggingface/sentence-transformers
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASS: ${NEO4J_PASS:-123456789}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
