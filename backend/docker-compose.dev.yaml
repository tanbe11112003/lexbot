name: saulvn-backend-dev
services:
  kong:
    image: kong:latest
    restart: always
    ports:
        - '8000:8000'
        - '8001:8001'
        - '8002:8002'
        - '8003:8003'
        - '8004:8004'
    environment:
        KONG_DATABASE: off
        KONG_PROXY_ACCESS_LOG: /dev/stdout
        KONG_ADMIN_ACCESS_LOG: /dev/stdout
        KONG_PROXY_ERROR_LOG: /dev/stderr
        KONG_ADMIN_ERROR_LOG: /dev/stderr
        KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
        KONG_ADMIN_LISTEN: '0.0.0.0:8001, 0.0.0.0:8444 ssl'
    volumes:
      - ./api-gateway/kong.dev.yml:/usr/local/kong/declarative/kong.yml
    networks:
        - app-network
  law-mysql:
    image: mysql:latest
    restart: always
    ports:
        - '3306:3306'
    volumes:
      - ./law-service/law-sql:/var/lib/mysql
    environment:
        MYSQL_ROOT_PASSWORD: 123456789
        MYSQL_DATABASE: law
        MYSQL_PASSWORD: 123456789
        MYSQL_USER: law
    networks:
        - app-network
  phpmyadmin:
    image: phpmyadmin
    ports:
      - 8081:80
    depends_on:
      - law-mysql
    networks:
      - app-network
    environment:
      PMA_HOST: law-mysql
      UPLOAD_LIMIT: 300M
  redis:
      restart: always
      image: redis:latest
      ports:
          - '6379:6379'
      networks:
          - app-network
  auth-mysql:
      image: mysql:latest
      ports:
        - '3308:3306'
      volumes:
        - ./auth-service/auth-sql:/var/lib/mysql
      restart: always
      environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auth
      networks:
          - app-network
  qna-mysql:
    image: mysql:latest
    restart: always
    volumes:
      - ./rag/qna-sql:/var/lib/mysql
    ports:
        - '3307:3306'
    environment:
        MYSQL_ROOT_PASSWORD: 123456789
        MYSQL_DATABASE: qna
    networks:
        - app-network
  neo4j:
    image: neo4j:5-community
    restart: always
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - ./graph/neo4j/data:/data
      - ./graph/neo4j/logs:/logs
    environment:
      NEO4J_AUTH: neo4j/123456789
    networks:
      - app-network
  qna-service:
    build: ./rag
    restart: always
    env_file:
      - ../.env
    depends_on:
      - qna-mysql
      - redis
      - neo4j
    ports:
      - '5001:5001'
    volumes:
      - ../web:/app/web:ro
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: qna
      MYSQL_HOST: qna-mysql
      REDIS_HOST: redis
      ACCESS_TOKEN_KEY: Vistral-Saul-VN
      MYSQL_PORT: 3306
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_QA_MODEL: ${GEMINI_QA_MODEL:-gemini-2.5-flash}
      GEMINI_ENRICH_MODEL: ${GEMINI_ENRICH_MODEL:-gemini-2.5-flash}
      OPENAI_QA_MODEL: ${OPENAI_QA_MODEL:-gpt-5.5}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-gpt-5.5}
      WEB_DIR: /app/web
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASS: ${NEO4J_PASS:-123456789}
networks:
    app-network:
        driver: bridge
