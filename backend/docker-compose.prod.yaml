name: saulvn-backend-production
services:
  kong:
    image: kong:latest
    restart: always
    ports:
        - '8000:8000'
        - '8001:8001'
        - '8002:8002'
        - '8003:8003'
        - '8004:8004'
    environment:
        KONG_DATABASE: off
        KONG_PROXY_ACCESS_LOG: /dev/stdout
        KONG_ADMIN_ACCESS_LOG: /dev/stdout
        KONG_PROXY_ERROR_LOG: /dev/stderr
        KONG_ADMIN_ERROR_LOG: /dev/stderr
        KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
        KONG_ADMIN_LISTEN: '0.0.0.0:8001, 0.0.0.0:8444 ssl'
    volumes:
      - ./api-gateway/kong.yml:/usr/local/kong/declarative/kong.yml
    networks:
        - app-network
  law-mysql:
    image: mysql:latest
    restart: always
    volumes:
      - ./law-service/law-sql:/var/lib/mysql
    environment:
        MYSQL_ROOT_PASSWORD: 123456789
        MYSQL_DATABASE: law
        MYSQL_PASSWORD: 123456789
        MYSQL_USER: law
    networks:
        - app-network
  neo4j:
    image: neo4j:5-community
    restart: always
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - ./graph/neo4j/data:/data
      - ./graph/neo4j/logs:/logs
    environment:
      NEO4J_AUTH: neo4j/123456789
    networks:
      - app-network
  phpmyadmin:
    image: phpmyadmin
    ports:
      - 8081:80
    depends_on:
      - law-mysql
    networks:
      - app-network
    environment:
      PMA_HOST: law-mysql
      UPLOAD_LIMIT: 300M
  law-service:
    image: d3r4nk/saulvn-law:latest
    restart: always
    depends_on:
      - law-mysql
    networks:
      - app-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://law-mysql:3306/law?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: law
      SPRING_DATASOURCE_PASSWORD: 123456789
  auth-service:
    image: d3r4nk/saulvn-auth:latest
    restart: always
    depends_on:
      - auth-mysql
    ports: 
      - 5000:5000
    networks:
      - app-network
    environment:
      ENVIRONMENT: development
      PORT: 5000
      DB_HOST: auth-mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: root
    secrets:
      - access_token_key
      - refresh_token_key
  redis:
      restart: always
      image: redis:latest
      ports:
          - '6379:6379'
      networks:
          - app-network
  auth-mysql:
      image: mysql:latest
      volumes:
        - ./auth-service/auth-sql:/var/lib/mysql
      restart: always
      environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auth
      networks:
          - app-network
  qna-mysql:
    image: mysql:latest
    restart: always
    volumes:
      - ~/data/qna-sql:/var/lib/mysql
    ports:
        - '3307:3306'
    environment:
        MYSQL_ROOT_PASSWORD: 123456789
        MYSQL_DATABASE: qna
    networks:
        - app-network
  qna-service:
    image: d3r4nk/saulvn-qna:latest
    restart: always
    env_file:
      - ../.env
    depends_on:
      - qna-mysql
      - redis
      - neo4j
    ports:
      - '5001:5001'
    volumes:
      - ../web:/app/web:ro
    networks:
        - app-network
    secrets:
      - access_token_key
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: qna
      MYSQL_HOST: qna-mysql
      REDIS_HOST: redis
      MYSQL_PORT: 3306
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_QA_MODEL: ${GEMINI_QA_MODEL:-gemini-2.5-flash}
      GEMINI_ENRICH_MODEL: ${GEMINI_ENRICH_MODEL:-gemini-2.5-flash}
      OPENAI_QA_MODEL: ${OPENAI_QA_MODEL:-gpt-5.5}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-gpt-5.5}
      WEB_DIR: /app/web
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASS: ${NEO4J_PASS:-123456789}
  recommendation-service:
    build: ./recommendation
    restart: always
    networks:
      - app-network
    environment:
      ST_MODEL_PATH: keepitreal/vietnamese-sbert
      QA_MODEL_PATH: namngo/videberta-xsmall-finetuned-squad
      TOPIC_DB_PATH: ./chroma_db_demuc
      REFRESH_TOKEN_KEY: auth-service
networks:
    app-network:
        driver: bridge
secrets:
  access_token_key:
    file: ./access_token_key.txt
  refresh_token_key:
    file: ./refresh_token_key.txt
